name: CI/CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: dmxbb7107/c2c-monitor:latest

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: FEISHU_WEBHOOK,FEISHU_SECRET
          script: |
            docker pull dmxbb7107/c2c-monitor:latest
            docker stop c2c-monitor || true
            docker rm c2c-monitor || true
            docker run -d \
              --name c2c-monitor \
              --restart unless-stopped \
              --env-file /root/c2c-monitor.env \
              dmxbb7107/c2c-monitor:latest
